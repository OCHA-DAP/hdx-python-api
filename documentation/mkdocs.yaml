site_name: HDX Python API
repo_url: https://github.com/OCHA-DAP/hdx-python-api/
repo_name: OCHA-DAP/hdx-python-api
docs_dir: .
site_dir: ../site
theme:
  name: material
  highlightjs: true
plugins:
  - search
  - mkapi
nav:
  - Home: index.md
  - Tutorials:
    - A Quick Example: tutorials/getting-started.md
  - How-to Guides:
    - Obtain your API Key: how-to/api-key.md
    - Install the Library: how-to/install.md
    - Build a Docker image: how-to/docker.md
    - Build a project Framework: how-to/framework.md
    - Use Facades: how-to/facades.md
    - Customise the Configuration: how-to/customisation.md
    - Configure Logging: how-to/logging.md
    - Use HDX Objects: how-to/objects.md
    - Operate on Datasets:
      - Set Dataset Time Period: how-to/operate-datasets/time-period.md
      - Set Expected Update Frequency: how-to/operate-datasets/update-frequency.md
      - Set Location: how-to/operate-datasets/location.md
      - Set Tags: how-to/operate-datasets/tags.md
      - Set Maintainer: how-to/operate-datasets/maintainer.md
      - Set Organization: how-to/operate-datasets/organization.md
      - Set Custom Visualization: how-to/operate-datasets/visualization.md
      - Manage Dataset Resources: how-to/operate-datasets/dataset-resources.md
      - Generate Resources: how-to/operate-datasets/resource-generation.md
    - Operate on Resources:
      - Operate on Resources: how-to/operate-resources/resource-operations.md
      - Manage the Data Dictionary: how-to/operate-resources/data-dictionary.md
      - Use the Datastore: how-to/operate-resources/datastore.md
    - Manage Showcases: how-to/showcases.md
    - Manage Users: how-to/users.md
    - Manage Organizations: how-to/organizations.md
    - Manage Locations: how-to/locations.md
    - Manage Vocabularies: how-to/vocabularies.md
    - Use Activity Streams: how-to/activity-streams.md
    - Get HDX Statistics: how-to/statistics.md
    - Manage Pipeline State: how-to/pipeline-state.md
    - Working Examples: how-to/working-examples.md
    - IDMC Example: how-to/idmc-example.md
  - Reference:
    - Breaking Changes: reference/changelog.md
    - API Documentation:
        - Configuration: $src/hdx.api.configuration.*
        - Locations: $src/hdx.api.locations.*
        - Dataset: $src/hdx.data.dataset.*
        - Resource: $src/hdx.data.resource.*
        - Resource View: $src/hdx.data.resource_view.*
        - Showcase: $src/hdx.data.showcase.*
        - User: $src/hdx.data.user.*
        - Organization: $src/hdx.data.organization.*
        - Vocabulary: $src/hdx.data.vocabulary.*
        - Simple Facade: $src/hdx.facades.simple.*
        - Keyword Arguments Facade: $src/hdx.facades.keyword_arguments.*
  - Explanation:
    - Information: explanation/information.md
    - Default Configuration for Facades: explanation/facades.md
    - Brief History: explanation/history.md

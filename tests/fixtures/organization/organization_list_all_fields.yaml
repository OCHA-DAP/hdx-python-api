  description: |
    Sawa World is a global organization with its headquarters in Uganda, East Africa. The organization uses a locally-led and innovative approach to eradicate global poverty by providing large-scale access to locally created, easy-to-start, and eco-friendly local solutions that are found by youth living in poverty. These locally created business skills can generate income and improve the lives of youth and their households.
    Since 2011, Sawa World has reached over 88,000 youth, encouraged them to start over 19,000 micro-businesses, and improved the livelihoods of an estimated 780,000 families. Sawa World’s model has been implemented in 11 countries. We have worked with numerous international governments and development organizations, including the Lavazza Foundation, U.S. President's Emergency Plan for AIDS Relief (PEPFAR), TechnoServe, Mercy Corps, Italia Uganda Foundation, Stromme Foundation, School For Life Foundation, Komo Learning Centres, and Aidsfonds (Netherlands), among others.

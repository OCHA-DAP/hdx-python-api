name: Run tests

on:
  workflow_dispatch:
  push:
    branches-ignore: [gh-pages, "dependabot/**"]
  pull_request:
    branches-ignore: [gh-pages]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check styling
        run: |
          uv run ruff format --check
          uv run ruff check

      - name: Test with pytest
        env:
          HDX_KEY_TEST: ${{ secrets.HDX_BOT_SCRAPERS_API_TOKEN }}
          GSHEET_AUTH: ${{ secrets.HDX_PIPELINE_GSHEET_AUTH }}
        run: uv run pytest

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: test-results.xml

      - name: Publish in Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: always()
        with:
          flag-name: tests
          format: lcov
